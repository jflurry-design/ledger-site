<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kitchen Table Finance">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA394"/>
      <stop offset="1" stop-color="#26776D"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- tabletop -->
  <rect x="13" y="25" width="38" height="6" rx="3" fill="#FAF8F5"/>
  <!-- legs -->
  <rect x="18" y="31" width="5" height="17" rx="2.5" fill="#FAF8F5" opacity=".92"/>
  <rect x="41" y="31" width="5" height="17" rx="2.5" fill="#FAF8F5" opacity=".92"/>
  <!-- soft pebble (the month gauge) resting on the table -->
  <ellipse cx="32" cy="19.5" rx="8" ry="5.5" fill="#E3F1EE"/>
</svg>
